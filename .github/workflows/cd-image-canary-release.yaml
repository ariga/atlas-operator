name: CD - Image Canary Release
on:
  schedule:
    - cron: '0 7 * * 0-4'
  workflow_dispatch:
concurrency:
  group: image-canary
  cancel-in-progress: false
jobs:
  image:
    name: Canary
    # Granted here, not only in the called workflow: permissions can be
    # maintained or reduced down a workflow_call chain, never elevated.
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/cd-image.yaml
    with:
      # Publishes the "nightly" tag, matching what the previous
      # `type=schedule` rule produced (its default pattern is "nightly").
      version: nightly
    secrets: inherit
