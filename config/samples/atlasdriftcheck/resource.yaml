apiVersion: db.atlasgo.io/v1alpha1
kind: AtlasDriftCheck
metadata:
  labels:
    app.kubernetes.io/name: atlasdriftcheck
    app.kubernetes.io/instance: atlasmigration-sample
    app.kubernetes.io/part-of: atlas-operator
