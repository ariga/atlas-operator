apiVersion: db.atlasgo.io/v1alpha1
kind: AtlasSecurityScan
metadata:
  labels:
    app.kubernetes.io/name: atlassecurityscan
    app.kubernetes.io/instance: atlassecurityscan-sample
    app.kubernetes.io/part-of: atlas-operator
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/created-by: atlas-operator
  name: atlassecurityscan-sample
spec:
  urlFrom:
    secretKeyRef:
      key: url
      name: db-credentials
  cloud:
    tokenFrom:
      secretKeyRef:
        key: token
        name: atlas-credentials
  # Scan every morning, and whenever the schema resource applies a change.
  schedule: "0 6 * * *"
  timeZone: UTC
  triggerOn:
    - kind: AtlasSchema
      name: atlasschema-sample
  # An issue at HIGH or above clears the "Secure" condition.
  failOn: HIGH
