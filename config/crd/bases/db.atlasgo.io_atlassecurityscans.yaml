    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AtlasSecurityScan scans a database with `atlas security scan` on a schedule and after the
          referenced AtlasSchema/AtlasMigration resources apply changes to it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AtlasSecurityScanSpec defines the desired state of AtlasSecurityScan.
            properties:
              backoffLimit:
                default: 20
                description: BackoffLimit is the number of retries of a failed scan
                  before the resource stalls. 0 means unlimited.
                minimum: 0
                type: integer
              cloud:
                description: Cloud defines the Atlas Cloud configuration. The Security
                  Graph requires Atlas Pro.
                properties:
                  repo:
                    description: Repo is the name of repository on the Atlas Cloud.
                    type: string
                  tokenFrom:
                    description: TokenFrom defines the reference to the secret key
                      that contains the Atlas Cloud Token.
                    properties:
                      secretKeyRef:
                        description: SecretKeyRef references to the key of a secret
                          in the same namespace.
                        properties:
                          key:
                            description: The key of the secret to select from.  Must
                              be a valid secret key.
                            type: string
                          name:
