                    type: integer
                  highestLevel:
                    description: SecurityLevel is a Security Graph grade. Uppercase
                      mirrors the CLI flags and atlas.hcl deliberately.
                    enum:
                    - NORMAL
                    - ELEVATED
                    - HIGH
                    - CRITICAL
                    type: string
                  levels:
                    items:
                      description: LevelCount is the number of non-waived findings
                        at one level.
                      properties:
                        count:
                          format: int32
                          type: integer
                        level:
                          description: SecurityLevel is a Security Graph grade. Uppercase
                            mirrors the CLI flags and atlas.hcl deliberately.
                          enum:
                          - NORMAL
                          - ELEVATED
                          - HIGH
                          - CRITICAL
                          type: string
