                          properties:
                            key:
                              description: The key of the secret to select from.  Must
                                be a valid secret key.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the Secret or its key must
                                be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                  type: object
                type: array
            type: object
            x-kubernetes-validations:
            - message: at least one of spec.schedule or spec.triggers must be set
              rule: (has(self.schedule) && self.schedule != '') || (has(self.triggers)
                && size(self.triggers) > 0)
            - message: use spec.timeZone instead of a TZ=/CRON_TZ= prefix
              rule: '!has(self.schedule) || !(self.schedule.startsWith(''TZ='') ||
                self.schedule.startsWith(''CRON_TZ=''))'
            - message: '@every is interval-based and drifts; use a cron expression
                or @hourly/@daily/@weekly/@monthly/@yearly'
              rule: '!has(self.schedule) || !self.schedule.startsWith(''@every'')'
            - message: timeZone must be an IANA zone name
              rule: '!has(self.timeZone) || self.timeZone != ''Local'''
            - message: cloud.repo is not used by security scans
              rule: '!has(self.cloud) || !has(self.cloud.repo)'
          status:
            default:
              observedGeneration: -1
            description: AtlasSecurityScanStatus defines the observed state of AtlasSecurityScan.
            properties:
              activeWaivers:
                description: ActiveWaivers lists the waiver ids that were in force
                  when the last successful scan started.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              failed:
                default: 0
                description: Failed is the number of consecutive failed attempts since
                  the last success.
                type: integer
              lastHandledScanRequest:
                description: LastHandledScanRequest is the scan-requested-at annotation
                  value whose scan completed successfully.
                type: string
              lastScan:
                description: LastScan describes the most recent attempt, whether it
                  succeeded or failed.
                properties:
                  completionTime:
                    format: date-time
                    type: string
                  inputsHash:
                    description: |-
                      InputsHash identifies what was observed when the attempt started. A stalled
                      resource makes one finished attempt per distinct hash.
                    type: string
                  message:
                    description: Message is a fixed description of a failure class,
                      never CLI or driver output.
                    type: string
                  result:
                    description: ScanResult is the outcome of a scan attempt.
                    enum:
                    - Succeeded
                    - Failed
                    type: string
                  startTime:
                    format: date-time
                    type: string
                  trigger:
                    description: ScanTrigger says why a scan ran.
                    enum:
                    - Spec
                    - Manual
                    - Apply
                    - Schedule
                    - Policy
                    type: string
                  triggeredBy:
                    type: string
                required:
                - startTime
                - trigger
                type: object
              lastScheduleTime:
                description: |-
                  LastScheduleTime is the latest schedule slot a successful scan covered. A scan that is still
                  running when a slot passes covers it, so this can be later than the start of that scan.
                format: date-time
                type: string
              lastSuccessfulTime:
                description: |-
                  LastSuccessfulTime is when the most recent successful scan completed. Summary, report and the
                  Compliant condition describe that scan.
                format: date-time
                type: string
              nextScheduleTime:
                description: |-
                  NextScheduleTime is the slot after LastScheduleTime. Omitted while suspended or without a schedule.
                  It advances only when a scan succeeds, so it stays at a missed slot until the catch-up completes.
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              reportRef:
                description: ReportRef names the AtlasSecurityReport holding the findings
                  of the last successful scan.
                properties:
