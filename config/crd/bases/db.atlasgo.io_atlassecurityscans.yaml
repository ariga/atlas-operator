                      - reason
                      type: object
                    maxItems: 256
                    type: array
                    x-kubernetes-list-map-keys:
                    - id
                    x-kubernetes-list-type: map
                  minSeverity:
                    default: NORMAL
                    description: MinSeverity is the lowest level that is reported
                      (--min-severity).
                    enum:
                    - NORMAL
                    - ELEVATED
                    - HIGH
                    - CRITICAL
                    type: string
                type: object
                x-kubernetes-validations:
                - message: failOn must be at or above minSeverity
                  rule: '!has(self.failOn) || !has(self.minSeverity) || {''NORMAL'':0,''ELEVATED'':1,''HIGH'':2,''CRITICAL'':3}[self.failOn]
