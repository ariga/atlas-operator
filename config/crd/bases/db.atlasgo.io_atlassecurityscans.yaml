                items:
                  description: ObservedTrigger is the revision of a trigger when a
                    scan started.
                  properties:
                    kind:
                      description: ScanTriggerKind is a kind whose applies can trigger
                        a scan.
                      enum:
                      - AtlasSchema
                      - AtlasMigration
                      type: string
                    name:
                      type: string
                    revision:
                      type: string
                    uid:
                      description: |-
                        UID is a type that holds unique ID values, including UUIDs.  Because we
                        don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                        intent and helps make sure that UIDs and names do not get conflated.
                      type: string
                  required:
                  - kind
                  - name
                  - revision
                  - uid
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - kind
                - name
                x-kubernetes-list-type: map
            type: object
