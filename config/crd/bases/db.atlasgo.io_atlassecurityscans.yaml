                          optional:
                            description: Specify whether the Secret or its key must
                              be defined
                            type: boolean
                        required:
                        - key
                        type: object
                        x-kubernetes-map-type: atomic
                    type: object
                type: object
              envName:
                description: |-
                  EnvName defines the environment name that defined in the project configuration.
                  If not defined, the default environment "k8s" will be used.
                type: string
              policy:
                description: Policy controls which findings are reported and which
                  make the database non-compliant.
                properties:
                  failOn:
                    description: 'FailOn is the lowest level at which a non-waived
                      finding makes Compliant=False. Unset: report only.'
                    enum:
                    - NORMAL
                    - ELEVATED
                    - HIGH
                    - CRITICAL
                    type: string
                  ignore:
                    description: Ignore lists vulnerabilities that do not count toward
                      the policy. They remain in the report, marked waived.
                    items:
                      description: IgnoredVulnerability is a waiver for one vulnerability.
                      properties:
                        expirationTime:
                          description: ExpirationTime is when the waiver stops applying.
                            A scan runs when it passes.
                          format: date-time
                          type: string
                        id:
                          description: ID of the vulnerability, e.g. CVE-2024-10977.
                          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$
                          type: string
                        reason:
                          description: Reason documents why the vulnerability is waived.
                          maxLength: 1024
                          minLength: 1
                          type: string
