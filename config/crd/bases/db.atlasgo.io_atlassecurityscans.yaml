                  evaluated in TimeZone.
                minLength: 1
                type: string
              suspend:
                description: Suspend pauses scanning. Everything that becomes due
                  while suspended is covered by one scan on resume.
                type: boolean
              timeZone:
                default: UTC
                description: TimeZone is the IANA name of the zone the schedule is
                  evaluated in. Defaults to UTC.
                minLength: 1
                type: string
              triggers:
                description: Triggers are resources in this namespace whose applies
                  cause a scan.
                items:
                  description: ScanTriggerRef references an AtlasSchema or AtlasMigration
                    in the same namespace.
                  properties:
                    kind:
                      description: ScanTriggerKind is a kind whose applies can trigger
                        a scan.
                      enum:
                      - AtlasSchema
                      - AtlasMigration
                      type: string
                    name:
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - kind
                - name
                x-kubernetes-list-type: map
              url:
                description: URL of the target database schema.
                type: string
              urlFrom:
                description: URLs may be defined as a secret key reference.
                properties:
                  secretKeyRef:
                    description: SecretKeyRef defines the secret key reference to
                      use for the user.
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        default: ""
                        description: |-
